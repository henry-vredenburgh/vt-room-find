<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#630031" />
    <meta
      name="description"
      content="Find Virginia Tech classrooms and view class schedules."
    />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>VT Room Finder</title>
    <link rel="stylesheet" href="./css/main.css" />
    <script type="module" src="./js/main.js"></script>
  </head>
  <body>
    <header>
      <h1>VT Room Finder</h1>
      <p id="schedule-status" role="status">Loading class schedule…</p>
    </header>
    <main>
      <div class="workspace">
        <aside>
          <form id="filters">
            <div class="section-heading">
              <h2>Filters</h2>
              <button type="reset" class="text-button">Reset</button>
            </div>
            <label for="search">Building or room</label
            ><input
              id="search"
              type="search"
              placeholder="Building name, code, or room"
              autocomplete="off"
            />
            <label for="building">Building</label
            ><select id="building">
              <option value="">All buildings</option>
            </select>
            <label for="date">Date</label
            ><input id="date" type="date" required />
            <div class="pair">
              <div>
                <label for="start">From</label
                ><input id="start" type="time" value="10:00" required />
              </div>
              <div>
                <label for="end">Until</label
                ><input id="end" type="time" value="11:00" required />
              </div>
            </div>
            <p class="help">Eastern time</p>
            <label class="check"
              ><input id="available" type="checkbox" />
              <span id="available-label">Only available rooms</span></label
            >
            <details class="more-filters">
              <summary>More filters</summary>
              <button id="nearby" type="button">Use my location</button>
              <p id="location-status" class="help" role="status"></p>
              <label for="capacity">Minimum seats</label>
              <input id="capacity" type="number" min="0" max="10000" value="0" />
              <fieldset>
                <legend>Room features</legend>
                <label class="check"><input type="checkbox" name="feature" value="FX14" /> Whiteboard</label>
                <label class="check"><input type="checkbox" name="feature" value="FX13" /> Chalkboard</label>
                <label class="check"><input type="checkbox" name="feature" value="PC19" /> Air conditioning</label>
                <label class="check"><input type="checkbox" name="feature" value="PC30" /> General assignment</label>
              </fieldset>
              <label class="check"><input id="archive" type="checkbox" /> 2018 archive</label>
            </details>
          </form>
        </aside>
        <section class="results-section" aria-label="Room results">
          <div class="results-header">
            <div>
              <p class="result-date" id="results-date"></p>
              <h2 id="count">Loading rooms…</h2>
            </div>
            <span id="coverage" class="time-range"></span>
          </div>
          <p id="feedback" role="status"></p>
          <div id="results" class="rooms"></div>
          <button id="more" class="secondary" hidden>Show more rooms</button>
        </section>
      </div>
    </main>
    <footer>
      <span>Campus Cuckoo · Originally by Brandon Walker</span>
      <a href="https://www.registrar.vt.edu/faculty-staff/Room-Reservations.html" target="_blank" rel="noopener">Room reservations</a>
    </footer>
    <dialog id="room-dialog" aria-labelledby="room-title">
      <div class="dialog-header">
        <div>
          <h2 id="room-title"></h2>
        </div>
        <button id="close" class="close" aria-label="Close room schedule">
          ×
        </button>
      </div>
      <p id="room-meta"></p>
      <div class="day-nav">
        <button id="previous" aria-label="Previous day">←</button
        ><strong id="calendar-date"></strong
        ><button id="next" aria-label="Next day">→</button>
      </div>
      <div class="legend">
        <span>Scheduled</span><span id="gap-legend">Unscheduled</span>
      </div>
      <div id="calendar-scroll" class="calendar-scroll">
        <div id="calendar" class="calendar"></div>
      </div>
      <h3>Schedule details</h3>
      <ul id="agenda"></ul>
    </dialog>
    <noscript
      ><p>
        Enable JavaScript to search classrooms and view schedules.
      </p></noscript
    >
  </body>
</html>
